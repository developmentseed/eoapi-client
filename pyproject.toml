[project]
name = "eoapi-client"
version = "0.1.0"
description = "Python client for eoAPI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
vector = [
    "owslib>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "owslib>=0.30",
    "pre-commit",
    "pytest>=8",
    "respx>=0.22.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["owslib.*"]
ignore_missing_imports = true
