name: Python check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint_and_test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure
